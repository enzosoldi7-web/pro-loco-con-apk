<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Gold Heraldic Ring -->
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.7" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

  <!-- Top Curved / Header Text: PRO LOCO -->
  <text x="256" y="66" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="30" fill="url(#gold)" text-anchor="middle" letter-spacing="5">
    PRO LOCO
  </text>

  <!-- Branches of Laurel and Oak (Alloro e Quercia) surrounding the shield -->
  <g stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Left Branch -->
    <path d="M 256 418 C 170 412, 108 345, 105 235 C 103 185, 118 145, 138 118" />
    <!-- Right Branch -->
    <path d="M 256 418 C 342 412, 404 345, 407 235 C 409 185, 394 145, 374 118" />
  </g>
  <!-- Laurel & Oak Leaves -->
  <g fill="url(#gold)" opacity="0.9">
    <!-- Left leaves -->
    <ellipse cx="106" cy="270" rx="14" ry="7" transform="rotate(-35 106 270)" />
    <ellipse cx="102" cy="225" rx="14" ry="7" transform="rotate(-15 102 225)" />
    <ellipse cx="112" cy="180" rx="14" ry="7" transform="rotate(10 112 180)" />
    <ellipse cx="128" cy="140" rx="13" ry="6" transform="rotate(30 128 140)" />
    <ellipse cx="132" cy="315" rx="14" ry="7" transform="rotate(-55 132 315)" />
    <ellipse cx="168" cy="358" rx="14" ry="7" transform="rotate(-65 168 358)" />
    <!-- Right leaves -->
    <ellipse cx="406" cy="270" rx="14" ry="7" transform="rotate(35 406 270)" />
    <ellipse cx="410" cy="225" rx="14" ry="7" transform="rotate(15 410 225)" />
    <ellipse cx="400" cy="180" rx="14" ry="7" transform="rotate(-10 400 180)" />
    <ellipse cx="384" cy="140" rx="13" ry="6" transform="rotate(-30 384 140)" />
    <ellipse cx="380" cy="315" rx="14" ry="7" transform="rotate(55 380 315)" />
    <ellipse cx="344" cy="358" rx="14" ry="7" transform="rotate(65 344 358)" />
  </g>

  <!-- Corona Muraria Comunale d'Argento e Oro (Municipal Crown of San Rufo) -->
  <g filter="url(#shadow)">
    <!-- Crown Base -->
    <rect x="176" y="112" width="160" height="22" rx="4" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <!-- Crown Towers / Merli -->
    <rect x="176" y="88" width="24" height="24" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <rect x="210" y="94" width="20" height="18" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <rect x="242" y="84" width="28" height="28" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <rect x="282" y="94" width="20" height="18" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <rect x="312" y="88" width="24" height="24" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <!-- Crown gates/muratura -->
    <rect x="184" y="96" width="8" height="10" rx="4" fill="#451a03" />
    <rect x="251" y="94" width="10" height="12" rx="5" fill="#451a03" />
    <rect x="320" y="96" width="8" height="10" rx="4" fill="#451a03" />
  </g>

  <!-- Scudo Sannitico Stemma di San Rufo (Samnite Shield with Silver Field) -->
  <g filter="url(#shadow)">
    <!-- Gold Outer Shield Border -->
    <path d="M 146 142
             L 366 142
             L 366 262
             C 366 338, 315 378, 256 404
             C 197 378, 146 338, 146 262
             Z"
          fill="url(#gold)" />

    <!-- Silver / White Inner Field (Campo d'Argento dello Stemma di San Rufo) -->
    <path d="M 158 154
             L 354 154
             L 354 260
             C 354 328, 308 364, 256 388
             C 204 364, 158 328, 158 260
             Z"
          fill="url(#silver)" />

    <!-- Elementi Araldici di San Rufo: Due Lance Incrociate + Scettro Centrale Verticale + Lettere O e M -->
    <!-- Lancia 1 (diagonale da sinistra in basso a destra in alto) -->
    <line x1="194" y1="342" x2="312" y2="192" stroke="url(#wood)" stroke-width="9" stroke-linecap="round" />
    <!-- Punta di ferro triangolare Lancia 1 -->
    <polygon points="324,176 300,190 316,203" fill="#334155" stroke="#0f172a" stroke-width="1.5" />

    <!-- Lancia 2 (diagonale da destra in basso a sinistra in alto) -->
    <line x1="318" y1="342" x2="200" y2="192" stroke="url(#wood)" stroke-width="9" stroke-linecap="round" />
    <!-- Punta di ferro triangolare Lancia 2 -->
    <polygon points="188,176 196,203 212,190" fill="#334155" stroke="#0f172a" stroke-width="1.5" />

    <!-- Scettro / Asta Centrale Verticale -->
    <line x1="256" y1="358" x2="256" y2="182" stroke="#92400e" stroke-width="10" stroke-linecap="round" />
    <!-- Pomello / Giglio superiore dello scettro -->
    <circle cx="256" cy="176" r="10" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
    <circle cx="256" cy="267" r="9" fill="url(#gold)" stroke="#78350f" stroke-width="2" />

    <!-- Lettere Araldiche "O" (a sinistra) e "M" (a destra) dello Stemma di San Rufo -->
    <text x="190" y="276" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="34" fill="#064e3b" text-anchor="middle">
      O
    </text>
    <text x="322" y="276" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="32" fill="#064e3b" text-anchor="middle">
      M
    </text>
  </g>

  <!-- Nastro Tricolore Italiano alla base dello scudo -->
  <g transform="translate(196, 408)">
    <rect x="0" y="0" width="40" height="10" rx="3" fill="#16a34a" />
    <rect x="40" y="0" width="40" height="10" rx="1" fill="#ffffff" />
    <rect x="80" y="0" width="40" height="10" rx="3" fill="#dc2626" />
  </g>

  <!-- Cartiglio Inferiore: SAN RUFO -->
  <rect x="96" y="432" width="320" height="48" rx="16" fill="#022c22" stroke="url(#gold)" stroke-width="3" />
  <text x="256" y="465" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="31" fill="#fbbf24" text-anchor="middle" letter-spacing="4">
    SAN RUFO
  </text>
</svg>
